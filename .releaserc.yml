#Global config
branches: ['main']
ci: true
debug: true
dryRun: false
tagFormat: 'v${version}'
#config preset
preset: 'conventionalcommits'
#publish to GitHub Releases 
githubUrl: 'https://github.com'

verifyConditions:
  - '@semantic-release/changelog'
  - '@semantic-release/git'
  - '@semantic-release/github'
  - 'semantic-release-export-data'
#config for commit analyzer
analyzeCommits:
  - path: '@semantic-release/commit-analyzer'
    releaseRules:
      - breaking: true
        release: major
      - type: breaking
        release: major
      - type: build
        release: false
      - type: chore
        release: false
      - type: ci
        release: false
      - type: docs
        release: false
      - type: feat
        release: minor
      - type: fix
        release: patch
      - type: perf
        release: patch
      - type: refactor
        release: false
      - type: revert
        release: patch
      - type: style
        release: false
      - type: test
        release: false

# Config for generate notes
generateNotes:
  - path: '@semantic-release/release-notes-generator'
    writeOpts:
      groupBy: 'type'
      commitGroupsSort: 'title'
      commitsSorts: 'header'
    preset: 'conventionalcommits'
    linkReferences: true
    linkCompare: true
    presetConfig:
      types:
        - type: 'breaking'
          section: 'Breaking changes'
          hidden: false
        - type: 'build'
          section: 'CI/CD'
          hidden: false
        - type: 'chore'
          section: 'Other'
          hidden: false
        - type: 'ci'
          section: 'CI/CD'
          hidden: false
        - type: 'docs'
          section: 'Docs'
          hidden: false
        - type: 'example'
          section: 'Examples'
          hidden: false
        - type: 'feat'
          section: 'Features'
          hidden: false
        - type: 'fix'
          section: 'Fixes'
          hidden: false
        - type: 'perf'
          section: 'Perfomance'
        - type: 'refactor'
          section: 'Refactor'
          hidden: false
        - type: 'revert'
          section: 'Reverts'
          hidden: false
        - type: 'style'
          section: 'Style'
          hidden: false
        - type: 'test'
          section: 'Tests'
          hidden: false
  - path: 'semantic-release-export-data'
    
prepare:
  - path: '@semantic-release/changelog'
  - path: '@semantic-release/git'
    message: 'RELEASE: v${nextRelease.version}'
    assets: ['CHANGELOG.md']

#Publish stage
publish:
  - path: '@semantic-release/github'
