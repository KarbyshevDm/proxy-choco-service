name: Release & Build Pipeline

on:
  push:
    branches:
      - main
  # Позволяет запустить сборку вручную из интерфейса GitHub (без релиза)
  workflow_dispatch:
    inputs:
      version:
        description: 'Ручная версия установщика (для тестов)'
        required: true
        default: '0.0.1'
      publish_to_chocolatey:
        description: 'Публиковать пакет на Chocolatey после загрузки в GitHub Release'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write
  pull-requests: write

defaults:
  run:
    shell: pwsh

jobs:
  # ШАГ 1: Анализ коммитов, создание тега и текстового релиза на GitHub
  semantic-release:
    name: Run Semantic Release
    runs-on: ubuntu-latest
    outputs:
      # Передаем информацию, создался ли новый релиз, в следующий шаг
      new_release_published: ${{ steps.release.outputs.new-release-published }}
      new_release_version: ${{ steps.release.outputs.new-release-version }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release + plugins
        shell: bash
        run: |
          npm install --no-save \
          semantic-release \
          @semantic-release/changelog \
          @semantic-release/git \
          @semantic-release/github \
          @semantic-release/commit-analyzer \
          @semantic-release/release-notes-generator \
          conventional-changelog-conventionalcommits \
          semantic-release-export-data

      - name: Run Semantic Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Debug Semantic Release Outputs
        run: |
          echo "=== ВЕСЬ МАССИВ OUTPUTS ШАГА ==="
          echo '${{ toJSON(steps.release.outputs) }}'
          echo "================================"

  # ШАГ 2: Сборка .NET приложения, компиляция Inno Setup и упаковка choco-пакета
  build-installer:
    name: Build & Pack
    runs-on: windows-latest
    needs: semantic-release
    # Запускаем сборку только если semantic-release создал новый релиз ИЛИ если вы запустили workflow вручную
    if: ${{ needs.semantic-release.outputs.new_release_version != '' || github.event_name == 'workflow_dispatch' }}
    outputs:
      resolved_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Перехватываем версию Inno Setup: либо из semantic-release, либо из ручного ввода
      - name: Resolve version
        id: version
        run: |
          $v = if ('${{ needs.semantic-release.outputs.new_release_version }}' -ne '') {
            '${{ needs.semantic-release.outputs.new_release_version }}'
          } else {
            $env:INPUT_VERSION
          }
          if (-not $v) { throw "Версия не задана" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - name: Restore dependencies
        run: dotnet restore PseudoConsoleGrpcService.sln -p:RestoreSources="https://api.nuget.org/v3/index.json"

      - name: Build solution
        run: dotnet build PseudoConsoleGrpcService.sln -p:Configuration=Release --no-restore

      - name: Publish (service + CLI) to publish/bin
        run: |
          dotnet publish ProxyChocoGrpcService/ProxyChocoGrpcService.csproj -p:Configuration=Release -p:PublishSingleFile=true -p:SelfContained=true --output ./publish/bin
          dotnet publish ConsoleApp/ConsoleApp.csproj -p:Configuration=Release -p:PublishSingleFile=true -p:SelfContained=true --output ./publish/bin

      - name: Compile Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: Setup/setup.iss
          options: >-
            /DOutputFileName=proxy-choco
            /DVersion=${{ steps.version.outputs.version }}
            /DOutputDirectory=${{ github.workspace }}/Installer
            /DSourceFilesDirectory=${{ github.workspace }}/publish/bin

      - name: Upload installer artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: proxy-choco-exe
          path: Installer/proxy-choco.exe
          if-no-files-found: error

      # Считаем SHA256 установщика и подставляем его в chocolateyInstall.ps1,
      # чтобы пакет на Chocolatey проверял целостность скачанного файла.
      - name: Inject installer checksum into chocolateyInstall.ps1
        run: |
          $exe = Join-Path $env:INSTALLER_DIR 'proxy-choco.exe'
          if (-not (Test-Path $exe)) { throw "Установщик не найден: $exe" }
          $sha = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLower()
          $ps1 = Join-Path $env:CHOCO_DIR 'chocolateyInstall.ps1'
          $content = Get-Content -Path $ps1 -Raw
          $content = $content -replace [regex]::Escape('__INSTALLER_SHA256__'), $sha
          Set-Content -Path $ps1 -Value $content -Encoding utf8
          Write-Host "Checksum injected: $sha"
        env:
          INSTALLER_DIR: ${{ github.workspace }}/Installer
          CHOCO_DIR: ${{ github.workspace }}/Choco

      # Пакуем choco-пакет (.nupkg) с версией релиза.
      # В nuspec версия задана как $chocolateyVersion$ — choco pack подставит её из --version.
      - name: Pack Chocolatey package
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: >-
            pack ${{ github.workspace }}/Choco/proxy-choco.nuspec
            --version ${{ steps.version.outputs.version }}
            --out ${{ github.workspace }}/Choco/out
            
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
          CHOCO_DIR: ${{ github.workspace }}/Choco

      - name: Collect nupkg
        run: |
          $src = Join-Path $env:CHOCO_DIR 'out'
          $dst = Join-Path $env:WORKSPACE 'choco-package'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path (Join-Path $src '*.nupkg') -Destination $dst -Force
          Get-ChildItem $dst
        env:
          CHOCO_DIR: ${{ github.workspace }}/Choco
          WORKSPACE: ${{ github.workspace }}

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-choco-nupkg
          path: choco-package/*.nupkg
          if-no-files-found: error

  # ШАГ 3: Загрузка инсталлятора в релиз GitHub (ЖДЕТ ВАШЕГО ОДОБРЕНИЯ)
  # КРИТИЧНО: именно после этой стадии ссылка
  #   https://github.com/KarbyshevDm/proxy-choco-service/releases/download/vX.Y.Z/proxy-choco.exe
  # становится доступной — только тогда можно публиковать пакет на Chocolatey,
  # т.к. chocolateyInstall.ps1 скачивает установщик именно из этого релиза.
  upload-to-github-release:
    name: Approve & Upload to GitHub Release
    runs-on: ubuntu-latest
    needs: [semantic-release, build-installer]

    # КРИТИЧНО: Связываем с окружением GitHub, где настроено ручное одобрение
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: proxy-choco-exe
          path: Installer

      - name: Upload Installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Installer/proxy-choco.exe
          # Берем тег: либо созданный на первом шаге, либо текущий (при ручном запуске)
          tag_name: ${{ needs.semantic-release.outputs.new_release_version && format('v{0}', needs.semantic-release.outputs.new_release_version) || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ШАГ 4: Публикация пакета на Chocolatey (только ПОСЛЕ успешной загрузки в GitHub Release,
  # чтобы ссылка на установщик уже существовала).
  publish-to-chocolatey:
    name: Push package to Chocolatey
    runs-on: ubuntu-latest
    needs: [semantic-release, build-installer, upload-to-github-release]
    if: >-
      needs.semantic-release.outputs.new_release_version != '' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_to_chocolatey == 'true')

    # Ручное одобрение публикации (можно задать в окружении production)
    environment: production

    steps:
      - name: Download nupkg artifact
        uses: actions/download-artifact@v4
        with:
          name: proxy-choco-nupkg
          path: choco-package

      
      - name: Find nupkg file and Push to Chocolatey
        # Используем экшен crazy-max/ghaction-chocolatey
        # api_key и source передаются отдельными инпутами экшена
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: >-
            push choco-package/*.nupkg
            --verbose --source=https://push.chocolatey.org/
            --api-key=${{ secrets.CHOCOLATEY_TOKEN }}
